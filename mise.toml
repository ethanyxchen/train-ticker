[tools]
node = "24.15.0"
gcloud = "latest"

[tasks.install]
description = "Install project dependencies"
run = "npm ci && npm --prefix workers/daily-schedule-cleanup ci"
sources = ["package.json", "package-lock.json", "workers/daily-schedule-cleanup/package.json", "workers/daily-schedule-cleanup/package-lock.json"]
outputs = ["node_modules/.package-lock.json", "workers/daily-schedule-cleanup/node_modules/.package-lock.json"]

[tasks.dev]
description = "Start the development server"
depends = ["install"]
run = "npm run dev"

[tasks.lint]
description = "Run the linter"
depends = ["install"]
run = "npm run lint"

[tasks.test]
description = "Run the test suite"
depends = ["install"]
run = "npm test"

[tasks.build]
description = "Build the app"
depends = ["install"]
run = "npm run build"

[tasks.start]
description = "Start the production server"
depends = ["install"]
run = "npm run start"

[tasks.worker-typecheck]
description = "Typecheck the daily schedule cleanup worker"
depends = ["install"]
run = "npm --prefix workers/daily-schedule-cleanup run typecheck"

[tasks.worker-test]
description = "Run the daily schedule cleanup worker tests"
depends = ["install"]
run = "npm --prefix workers/daily-schedule-cleanup test"

[tasks.worker-build]
description = "Build the daily schedule cleanup worker"
depends = ["install"]
run = "npm --prefix workers/daily-schedule-cleanup run build"

[tasks.cleanup-daily-schedule]
description = "Run the daily schedule cleanup worker"
depends = ["install"]
run = 'npm --prefix workers/daily-schedule-cleanup run cleanup:daily-schedule:dev -- "$@"'
