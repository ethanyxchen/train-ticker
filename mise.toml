[tools]
node = "24.15.0"

[tasks.install]
description = "Install project dependencies"
run = "npm ci"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]

[tasks.dev]
description = "Start the development server"
depends = ["install"]
run = "npm run dev"

[tasks.lint]
description = "Run the linter"
depends = ["install"]
run = "npm run lint"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "mise x actionlint@1.7.7 -- actionlint"

[tasks.zizmor]
description = "Audit GitHub Actions workflows"
run = "mise x zizmor@1.24.1 -- zizmor --no-online-audits --min-severity high .github/workflows"

[tasks.actions-lint]
description = "Run GitHub Actions checks"
depends = ["actionlint", "zizmor"]

[tasks.test]
description = "Run the test suite"
depends = ["install"]
run = "npm test"

[tasks.build]
description = "Build the app"
depends = ["install"]
run = "npm run build"

[tasks.start]
description = "Start the production server"
depends = ["install"]
run = "npm run start"
