name: Actions Lint

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: actions-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    name: actions-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          github_token: ${{ github.token }}

      - name: Run Actions lint
        run: mise run actions-lint
